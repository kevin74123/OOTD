<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>옷장</title><style>
:root{color-scheme:light}*{box-sizing:border-box}
html,body{margin:0;background:#fff;font:14px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif;color:#111}
body{padding:env(safe-area-inset-top,0) 0 calc(70px + env(safe-area-inset-bottom,0))}
button{font:inherit;border:1px solid #111;background:#fff;padding:8px 12px;border-radius:8px;color:#111;white-space:nowrap}
button.on{background:#111;color:#fff}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:1920px;margin:0 auto}
.c{position:relative;width:231px;height:231px}.c img{width:100%;height:100%;object-fit:contain;display:block}
.w{position:absolute;top:4px;right:4px;font-size:18px}.ok{position:absolute;bottom:4px;right:6px;font-size:12px}
.warn{margin:10px;padding:8px;text-align:center;background:#fff3cd;border-radius:8px}
@media(max-width:700px){.c{width:calc((100vw - 20px)/3);height:calc((100vw - 20px)/3)}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;border:0;border-radius:0;padding:16px 0}nav button.on{background:#fff;color:#111;font-weight:700;box-shadow:inset 0 -3px #111}
.cvx{position:relative;overflow:hidden}.cvx img{position:absolute;transform:translate(-50%,-50%);-webkit-user-drag:none;user-select:none}
#cv{width:min(calc(100vw - 20px),480px);aspect-ratio:3/4;margin:10px auto;border:1px solid #ddd;touch-action:none}
#cv img.sel{outline:1px dashed #888}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#hg{position:fixed;left:12px;bottom:calc(62px + env(safe-area-inset-bottom,0));width:52px;height:52px;border-radius:50%;padding:0;z-index:6;display:none}
#dr{position:fixed;left:0;right:0;bottom:calc(126px + env(safe-area-inset-bottom,0));background:#fff;border-top:1px solid #ddd;padding:8px;z-index:4;display:none}
.st{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}.t{flex:none;width:84px;height:84px;touch-action:pan-x}.t img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.gh{position:fixed;width:90px;transform:translate(-50%,-50%);pointer-events:none;z-index:20;opacity:.8}
.list{display:flex;flex-wrap:wrap;gap:12px;padding:10px;justify-content:center}.oc{width:160px}.pv{width:160px;aspect-ratio:3/4;border:1px solid #ddd}
#dt{display:none;position:fixed;inset:0;background:#fff;z-index:10;overflow:auto;padding:16px;text-align:center}
#dt>img{max-width:100%;max-height:50vh}#dt .st{justify-content:center;flex-wrap:wrap}#dt textarea{width:100%;height:40vh}
</style></head><body>
<div id="v"></div><div id="dr"></div>
<button id="hg" aria-label="옷걸이"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V7a2.2 2.2 0 1 0-2.2-2.2"/><path d="M12 8 3 15a1.4 1.4 0 0 0 .9 2.5h16.2A1.4 1.4 0 0 0 21 15z"/></svg></button>
<div id="dt"></div>
<nav><button data-v="closet">옷장</button><button data-v="make">코디 만들기</button><button data-v="saved">저장된 코디</button></nav>
<script>
const T=['아우터','상의','하의','신발','악세사리'],G={아우터:0,상의:1,악세사리:2,신발:2,하의:3},Z=[[.27,.25],[.73,.25],[.27,.75],[.73,.72],[.5,.5]],K='closet.v1';
let L=[],S={tags:{},tray:[],cv:[],outfits:[],ed:null},V='closet',F='전체',sel=-1;
const $=s=>document.querySelector(s),byId=i=>L.find(c=>c.id==i),gr=i=>G[S.tags[i]]??4;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function clean(){const ok=i=>L.some(c=>c.id==i);S.tray=S.tray.filter(ok);S.cv=S.cv.filter(o=>ok(o.id));S.outfits.forEach(o=>o.items=o.items.filter(i=>ok(i.id)))}
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}clean()}
function place(id){if(!S.tray.includes(id))S.tray.push(id);S.cv=S.cv.filter(o=>o.id!=id);const g=gr(id),n=S.cv.filter(o=>gr(o.id)==g).length,[x,y]=Z[g];
 S.cv.push({id,x:x+(n?(n%2?1:-1)*Math.ceil(n/2)*.09:0),y,s:n?.85:1,r:0});save()}
function renderCv(el,items,s){el.innerHTML='';items.forEach((o,i)=>{const im=new Image();im.src=byId(o.id).image;im.draggable=false;im.dataset.i=i;
 im.style.cssText=`left:${o.x*100}%;top:${o.y*100}%;width:${40*o.s}%;transform:translate(-50%,-50%) rotate(${o.r}rad)`;if(i===s)im.className='sel';el.appendChild(im)})}
const draw=()=>renderCv($('#cv'),S.cv,sel);
function home(){const u=L.filter(c=>!S.tags[c.id]).length;$('#v').innerHTML=(u?`<div class="warn">⚠️ 태그 없는 옷 ${u}벌</div>`:'')+'<div class="grid"></div>';
 L.forEach(c=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<img src="${c.image}" alt="${c.name}" loading="lazy">`+(S.tags[c.id]?'':'<span class="w">⚠️</span>')+(S.tray.includes(c.id)?'<span class="ok">✓</span>':'');d.onclick=()=>detail(c);$('.grid').appendChild(d)})}
function detail(c){const o=$('#dt');o.style.display='block';o.innerHTML=`<img src="${c.image}"><h3>${c.name}</h3><div class="st" id="tg"></div><p><button id="tr"></button> <button id="x">닫기</button></p>`;
 T.forEach(t=>{const b=document.createElement('button');b.textContent=t;if(S.tags[c.id]==t)b.className='on';b.onclick=()=>{S.tags[c.id]==t?delete S.tags[c.id]:S.tags[c.id]=t;save();detail(c);home()};$('#tg').appendChild(b)});
 const tr=$('#tr'),lb=()=>tr.textContent=S.tray.includes(c.id)?'담기 취소':'담기';lb();
 tr.onclick=()=>{S.tray.includes(c.id)?S.tray=S.tray.filter(i=>i!=c.id):S.tray.push(c.id);save();lb();home()};$('#x').onclick=()=>o.style.display='none'}
const P=new Map();
function cvInit(){const cv=$('#cv');
 cv.onpointerdown=e=>{const im=e.target.closest('img');if(!P.size){if(!im){sel=-1;draw();return}const o=S.cv.splice(+im.dataset.i,1)[0];S.cv.push(o);sel=S.cv.length-1;draw()}
  if(sel<0)return;cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY})};
 cv.onpointermove=e=>{const p=P.get(e.pointerId);if(!p||sel<0)return;const o=S.cv[sel],r=cv.getBoundingClientRect();
  if(P.size==1){o.x+=(e.clientX-p.x)/r.width;o.y+=(e.clientY-p.y)/r.height}
  else{const[a,b]=[...P.keys()],q=P.get(a),w=P.get(b),n=e.pointerId==a?{x:e.clientX,y:e.clientY}:q,m=e.pointerId==b?{x:e.clientX,y:e.clientY}:w;
   const d0=Math.hypot(q.x-w.x,q.y-w.y),d1=Math.hypot(n.x-m.x,n.y-m.y);if(d0>0)o.s=Math.min(4,Math.max(.2,o.s*d1/d0));
   o.r+=Math.atan2(m.y-n.y,m.x-n.x)-Math.atan2(w.y-q.y,w.x-q.x)}
  p.x=e.clientX;p.y=e.clientY;draw()};
 cv.onpointerup=cv.onpointercancel=e=>{P.delete(e.pointerId);save()};
 cv.onwheel=e=>{if(sel<0)return;e.preventDefault();const o=S.cv[sel];o.s=Math.min(4,Math.max(.2,o.s*(e.deltaY<0?1.08:.93)));draw();save()}}
function add(id){place(id);sel=S.cv.length-1;draw();drawer()}
function thumb(c){const d=document.createElement('div');d.className='t';d.innerHTML=`<img src="${c.image}">`;let st=null,gh=null;
 d.onpointerdown=e=>{st={x:e.clientX,y:e.clientY};d.setPointerCapture(e.pointerId)};
 d.onpointermove=e=>{if(!st)return;if(!gh&&st.y-e.clientY>24){gh=d.firstChild.cloneNode();gh.className='gh';document.body.appendChild(gh)}if(gh){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'}};
 d.onpointerup=e=>{if(!st)return;if(gh){const r=$('#cv').getBoundingClientRect();gh.remove();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)add(c.id)}else if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)add(c.id);gh=st=null};
 d.onpointercancel=()=>{if(gh)gh.remove();gh=st=null};return d}
function drawer(){const el=$('#dr');el.innerHTML='';const ch=document.createElement('div'),st=document.createElement('div');ch.className=st.className='st';
 ['전체','담아둔',...T,'미분류'].forEach(f=>{const b=document.createElement('button');b.textContent=f;if(f==F)b.className='on';b.onclick=()=>{F=f;drawer()};ch.appendChild(b)});
 L.filter(c=>F=='전체'||(F=='담아둔'?S.tray.includes(c.id):F=='미분류'?!S.tags[c.id]:S.tags[c.id]==F)).forEach(c=>st.appendChild(thumb(c)));
 if(!st.children.length)st.textContent='옷이 없어요';el.append(ch,st)}
function make(){$('#v').innerHTML='<div id="cv" class="cvx"></div><div class="bar"><button id="b1">재배치</button><button id="b2">선택 빼기</button><button id="b3">새 코디</button><button id="b4">저장</button></div>';cvInit();draw();
 $('#b1').onclick=()=>{const ids=S.cv.map(o=>o.id);S.cv=[];ids.forEach(place);sel=-1;draw()};
 $('#b2').onclick=()=>{if(sel>=0){S.cv.splice(sel,1);sel=-1;save();draw()}};
 $('#b3').onclick=()=>{if(S.cv.length&&!confirm('지금 코디를 비울까요?'))return;S.cv=[];S.ed=null;sel=-1;save();draw()};
 $('#b4').onclick=()=>{const n=prompt('코디 이름',S.ed!=null&&S.outfits[S.ed]?S.outfits[S.ed].name:'');if(n===null)return;const o={name:n||'코디',items:JSON.parse(JSON.stringify(S.cv))};
  if(S.ed!=null&&S.outfits[S.ed])S.outfits[S.ed]=o;else{S.outfits.push(o);S.ed=S.outfits.length-1}save();alert('저장했어요')}}
function saved(){$('#v').innerHTML='<div class="list"></div><p style="text-align:center"><button id="bk">백업 / 복원</button></p>';
 if(!S.outfits.length)$('.list').textContent='저장된 코디가 없어요';
 S.outfits.forEach((o,i)=>{const d=document.createElement('div');d.className='oc';d.innerHTML='<div class="pv cvx"></div><b></b><br><button class="op">열기</button> <button class="dl">삭제</button>';d.querySelector('b').textContent=o.name;renderCv(d.firstChild,o.items,-1);
  d.querySelector('.op').onclick=()=>{S.cv=JSON.parse(JSON.stringify(o.items));S.ed=i;sel=-1;save();go('make')};
  d.querySelector('.dl').onclick=()=>{if(!confirm('삭제할까요?'))return;S.outfits.splice(i,1);if(S.ed==i)S.ed=null;else if(S.ed>i)S.ed--;save();saved()};$('.list').appendChild(d)});
 $('#bk').onclick=backup}
function backup(){const o=$('#dt');o.style.display='block';o.innerHTML='<h3>백업 / 복원</h3><p>복사해서 메모에 붙여 두세요. 복원은 아래 칸에 붙여넣고 복원을 누르세요.</p><textarea id="ta"></textarea><p><button id="cp">복사</button> <button id="rs">복원</button> <button id="x">닫기</button></p>';
 const t=$('#ta');t.value=JSON.stringify({v:1,tags:S.tags,tray:S.tray,cv:S.cv,outfits:S.outfits,ed:S.ed});
 $('#cp').onclick=()=>{t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy'))};
 $('#rs').onclick=()=>{try{const d=JSON.parse(t.value);if(!d.tags||!d.outfits)throw 0;if(!confirm('지금 내용을 덮어쓸까요?'))return;
  S.tags=d.tags;S.tray=d.tray||[];S.cv=d.cv||[];S.outfits=d.outfits;S.ed=d.ed??null;clean();save();o.style.display='none';go(V)}catch(e){alert('백업 형식이 아니에요')}};
 $('#x').onclick=()=>o.style.display='none'}
function go(v){V=v;sel=-1;$('#dt').style.display='none';$('#dr').style.display='none';$('#hg').style.display=v=='make'?'block':'none';
 document.querySelectorAll('nav button').forEach(b=>b.className=b.dataset.v==v?'on':'');({closet:home,make,saved})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#hg').onclick=()=>{const d=$('#dr');d.style.display=d.style.display=='block'?'none':'block';drawer()};
fetch('clothes.json').then(r=>r.json()).then(l=>{L=l;load();go('closet')}).catch(()=>$('#v').textContent='clothes.json을 불러오지 못했어요.');
</script></body></html>
