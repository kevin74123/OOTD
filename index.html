<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Closet</title><style>
:root{color-scheme:light}*{box-sizing:border-box}
html,body{margin:0;background:#fff;font:14px/1.4 Helvetica,"Helvetica Neue",Arial,sans-serif;color:#111;letter-spacing:.02em}
body{padding:env(safe-area-inset-top,0) 0 calc(70px + env(safe-area-inset-bottom,0))}
button{font:inherit;font-size:12px;text-transform:uppercase;border:1px solid #111;background:#fff;padding:9px 6px;border-radius:8px;color:#111;white-space:nowrap}
button.on{background:#111;color:#fff}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:1920px;margin:0 auto}
.c{position:relative;width:231px;height:231px;touch-action:pan-y;-webkit-touch-callout:none;user-select:none}
.c img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.w{position:absolute;top:4px;right:4px;font-size:18px}.ok{position:absolute;bottom:4px;right:6px;font-size:12px}
.warn{margin:10px;padding:8px;text-align:center;background:#fff3cd;border-radius:8px}
@media(max-width:700px){.c{width:calc((100vw - 20px)/3);height:calc((100vw - 20px)/3)}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;border:0;border-radius:0;padding:16px 0;opacity:.4}nav button.on{opacity:1;background:#fff;color:#111;font-weight:700}
.cvx{position:relative;overflow:hidden}
.it{position:absolute;background:var(--u) var(--ps)/var(--sz) no-repeat}
.it i{position:absolute;inset:0;background:#e00;opacity:0;pointer-events:none;-webkit-mask:var(--u) var(--ps)/var(--sz) no-repeat;mask:var(--u) var(--ps)/var(--sz) no-repeat}
.it.h i{opacity:.55}
.row{display:flex;gap:8px;justify-content:center;align-items:flex-start;padding:10px}
.col{display:flex;flex-direction:column;gap:8px;width:84px;flex:none}
#cv{width:min(calc(100vw - 116px),480px);aspect-ratio:3/4;touch-action:none;flex:none}
#bk,#hg{position:fixed;left:12px;bottom:calc(62px + env(safe-area-inset-bottom,0));width:52px;height:52px;border-radius:50%;padding:0;z-index:6;display:none}
#bk.hot{background:#e00;color:#fff;transform:scale(1.2)}
#bk b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e00;color:#fff;font-size:11px;line-height:18px}
#dr{position:fixed;left:0;right:0;bottom:calc(126px + env(safe-area-inset-bottom,0));background:#fff;padding:8px;z-index:4;display:none}
.st{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}.t{flex:none;width:84px;height:84px;touch-action:pan-x}.t img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.gh{position:fixed;width:90px;transform:translate(-50%,-50%);pointer-events:none;z-index:20;opacity:.85}
.list{flex:1;display:flex;flex-wrap:wrap;gap:16px}.oc{display:flex;gap:6px;align-items:flex-start}.oc .col{width:64px}.pv{width:130px;aspect-ratio:3/4}
#dt{display:none;position:fixed;inset:0;background:#fff;z-index:10;overflow:auto;padding:16px;text-align:center}
#dt>img{max-width:100%;max-height:50vh}#dt .st{justify-content:center;flex-wrap:wrap}#dt textarea{width:100%;height:40vh}
</style></head><body>
<div id="v"></div><div id="dr"></div>
<button id="bk" aria-label="basket"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2 11H5z"/><path d="M8 9l4-5 4 5"/></svg><b></b></button>
<button id="hg" aria-label="hanger"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V7a2.2 2.2 0 1 0-2.2-2.2"/><path d="M12 8 3 15a1.4 1.4 0 0 0 .9 2.5h16.2A1.4 1.4 0 0 0 21 15z"/></svg></button>
<div id="dt"></div>
<nav><button data-v="closet">Closet</button><button data-v="saved">Saved</button></nav>
<script>
const T=['OUTER','TOP','BOTTOM','SHOES','ACCESSORY'],G={OUTER:0,TOP:1,ACCESSORY:2,SHOES:2,BOTTOM:3},K='closet.v2',BASE=.5,AR=4/3;
const KO={'\uC544\uC6B0\uD130':'OUTER','\uC0C1\uC758':'TOP','\uD558\uC758':'BOTTOM','\uC2E0\uBC1C':'SHOES','\uC545\uC138\uC0AC\uB9AC':'ACCESSORY'};
let L=[],S={tags:{},tray:[],cv:[],outfits:[],ed:null},V='closet',F='ALL',sel=-1,D=false;
const $=s=>document.querySelector(s),byId=i=>L.find(c=>c.id==i),gr=i=>G[S.tags[i]]??4;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const mt=t=>{const r={};for(const i in t||{})r[i]=KO[t[i]]||t[i];return r};
function clean(){const ok=i=>L.some(c=>c.id==i);S.tray=S.tray.filter(ok);S.cv=S.cv.filter(o=>ok(o.id));S.outfits.forEach(o=>o.items=o.items.filter(i=>ok(i.id)))}
function load(){try{const j=localStorage.getItem(K);if(j)Object.assign(S,JSON.parse(j));else{const o=JSON.parse(localStorage.getItem('closet.v1')||'{}');S.tags=mt(o.tags);S.tray=o.tray||[]}S.tags=mt(S.tags)}catch(e){}clean()}
const sz=(id,s)=>{const b=byId(id).b,w=BASE*b[2]*s;return[w,w*b[3]/b[2]/AR]};
function place(id){if(!S.tray.includes(id))S.tray.push(id);S.cv=S.cv.filter(o=>o.id!=id);const g=gr(id),[w,h]=sz(id,1);let u=0;S.cv.forEach(o=>{if(gr(o.id)==g)u+=sz(o.id,o.s)[0]});
 const cl=v=>Math.min(1-w/2,Math.max(w/2,v));S.cv.push({id,x:g==4?.5:cl(g==0||g==2?.5-u-w/2:.5+u+w/2),y:g==4?.5:g<2?.5-h/2:.5+h/2,s:1,r:0});save()}
function renderCv(el,items,s,h){el.innerHTML='';items.forEach((o,i)=>{const c=byId(o.id),[bx,by,bw,bh]=c.b,d=document.createElement('div'),H=h&&i===s;d.className='it'+(H?' h':'');d.dataset.i=i;
 d.style.cssText=`--u:url(${c.image});--sz:${100/bw}% ${100/bh}%;--ps:${bw<1?bx/(1-bw)*100:0}% ${bh<1?by/(1-bh)*100:0}%;left:${o.x*100}%;top:${o.y*100}%;width:${BASE*bw*o.s*100}%;aspect-ratio:${bw}/${bh};transform:translate(-50%,-50%) rotate(${o.r}rad) scale(${H?1.08:1})`;d.innerHTML='<i></i>';el.appendChild(d)})}
const P=new Map(),draw=()=>renderCv($('#cv'),S.cv,sel,P.size>0);
function mark(d,id){const o=d.querySelector('.ok');if(S.tray.includes(id)){if(!o)d.insertAdjacentHTML('beforeend','<span class="ok">✓</span>')}else if(o)o.remove()}
function bd(){const b=$('#bk b');b.textContent=S.tray.length;b.style.display=S.tray.length?'block':'none'}
const over=(x,y)=>{const r=$('#bk').getBoundingClientRect();return x>r.left-24&&x<r.right+24&&y>r.top-24&&y<r.bottom+24};
function drag(d,c){let st,gh,tm;
 const lift=(x,y)=>{gh=d.querySelector('img').cloneNode();gh.className='gh';document.body.appendChild(gh);D=true;mv(x,y)},
 mv=(x,y)=>{gh.style.left=x+'px';gh.style.top=y+'px';$('#bk').classList.toggle('hot',over(x,y))},
 end=()=>{clearTimeout(tm);if(gh)gh.remove();D=false;$('#bk').classList.remove('hot');st=gh=null};
 d.onpointerdown=e=>{st={x:e.clientX,y:e.clientY};d.setPointerCapture(e.pointerId);if(e.pointerType!='mouse')tm=setTimeout(()=>lift(st.x,st.y),280)};
 d.onpointermove=e=>{if(!st)return;if(gh)return mv(e.clientX,e.clientY);const m=Math.hypot(e.clientX-st.x,e.clientY-st.y);if(e.pointerType=='mouse'){if(m>6)lift(e.clientX,e.clientY)}else if(m>10){clearTimeout(tm);st=null}};
 d.onpointerup=e=>{if(!st)return;const m=Math.hypot(e.clientX-st.x,e.clientY-st.y);if(gh){if(over(e.clientX,e.clientY)){if(!S.tray.includes(c.id))S.tray.push(c.id);save();mark(d,c.id);bd()}end()}else{end();if(m<10)detail(c)}};
 d.onpointercancel=end;d.oncontextmenu=e=>e.preventDefault()}
document.addEventListener('touchmove',e=>{if(D)e.preventDefault()},{passive:false});
function home(){const u=L.filter(c=>!S.tags[c.id]).length;$('#v').innerHTML=(u?`<div class="warn">⚠️ ${u} item${u>1?'s':''} without tags</div>`:'')+'<div class="grid"></div>';
 L.forEach(c=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<img src="${c.image}" alt="${c.name}">`+(S.tags[c.id]?'':'<span class="w">⚠️</span>');mark(d,c.id);drag(d,c);$('.grid').appendChild(d)});bd()}
function detail(c){const o=$('#dt');o.style.display='block';o.innerHTML=`<img src="${c.image}"><h3>${c.name}</h3><div class="st" id="tg"></div><p><button id="tr"></button> <button id="x">Close</button></p>`;
 T.forEach(t=>{const b=document.createElement('button');b.textContent=t;if(S.tags[c.id]==t)b.className='on';b.onclick=()=>{S.tags[c.id]==t?delete S.tags[c.id]:S.tags[c.id]=t;save();detail(c);home()};$('#tg').appendChild(b)});
 const tr=$('#tr'),lb=()=>tr.textContent=S.tray.includes(c.id)?'Remove from basket':'Add to basket';lb();
 tr.onclick=()=>{S.tray.includes(c.id)?S.tray=S.tray.filter(i=>i!=c.id):S.tray.push(c.id);save();lb();home()};$('#x').onclick=()=>o.style.display='none'}
function cvInit(){const cv=$('#cv');
 cv.onpointerdown=e=>{const im=e.target.closest('.it');if(!P.size){if(!im){sel=-1;draw();return}const o=S.cv.splice(+im.dataset.i,1)[0];S.cv.push(o);sel=S.cv.length-1}
  if(sel<0)return;cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});draw()};
 cv.onpointermove=e=>{const p=P.get(e.pointerId);if(!p||sel<0)return;const o=S.cv[sel],r=cv.getBoundingClientRect();
  if(P.size==1){o.x+=(e.clientX-p.x)/r.width;o.y+=(e.clientY-p.y)/r.height}
  else{const[a,b]=[...P.keys()],q=P.get(a),w=P.get(b),n=e.pointerId==a?{x:e.clientX,y:e.clientY}:q,m=e.pointerId==b?{x:e.clientX,y:e.clientY}:w;
   const d0=Math.hypot(q.x-w.x,q.y-w.y),d1=Math.hypot(n.x-m.x,n.y-m.y);if(d0>0)o.s=Math.min(4,Math.max(.2,o.s*d1/d0));
   o.r+=Math.atan2(m.y-n.y,m.x-n.x)-Math.atan2(w.y-q.y,w.x-q.x)}
  p.x=e.clientX;p.y=e.clientY;draw()};
 cv.onpointerup=cv.onpointercancel=e=>{P.delete(e.pointerId);save();draw()};
 cv.onwheel=e=>{if(sel<0)return;e.preventDefault();const o=S.cv[sel];o.s=Math.min(4,Math.max(.2,o.s*(e.deltaY<0?1.08:.93)));draw();save()}}
function add(id){place(id);sel=S.cv.length-1;draw();drawer()}
function thumb(c){const d=document.createElement('div');d.className='t';d.innerHTML=`<img src="${c.image}">`;let st=null,gh=null;
 d.onpointerdown=e=>{st={x:e.clientX,y:e.clientY};d.setPointerCapture(e.pointerId)};
 d.onpointermove=e=>{if(!st)return;if(!gh&&st.y-e.clientY>24){gh=d.firstChild.cloneNode();gh.className='gh';document.body.appendChild(gh)}if(gh){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'}};
 d.onpointerup=e=>{if(!st)return;if(gh){const r=$('#cv').getBoundingClientRect();gh.remove();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)add(c.id)}else if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)add(c.id);gh=st=null};
 d.onpointercancel=()=>{if(gh)gh.remove();gh=st=null};return d}
function drawer(){const el=$('#dr');el.innerHTML='';const ch=document.createElement('div'),st=document.createElement('div');ch.className=st.className='st';
 ['ALL','BASKET',...T,'UNTAGGED'].forEach(f=>{const b=document.createElement('button');b.textContent=f;if(f==F)b.className='on';b.onclick=()=>{F=f;drawer()};ch.appendChild(b)});
 L.filter(c=>F=='ALL'||(F=='BASKET'?S.tray.includes(c.id):F=='UNTAGGED'?!S.tags[c.id]:S.tags[c.id]==F)).forEach(c=>st.appendChild(thumb(c)));
 if(!st.children.length)st.textContent='Empty';el.append(ch,st)}
function make(){$('#v').innerHTML='<div class="row"><div id="cv" class="cvx"></div><div class="col"><button id="b1">Rearrange</button><button id="b2">Remove</button><button id="b3">New</button><button id="b4">Save</button></div></div>';cvInit();draw();
 $('#b1').onclick=()=>{const ids=S.cv.map(o=>o.id);S.cv=[];ids.forEach(place);sel=-1;draw()};
 $('#b2').onclick=()=>{if(sel>=0){S.cv.splice(sel,1);sel=-1;save();draw()}};
 $('#b3').onclick=()=>{if(S.cv.length&&!confirm('Clear the current outfit?'))return;S.cv=[];S.ed=null;sel=-1;save();draw()};
 $('#b4').onclick=()=>{const n=prompt('Outfit name',S.ed!=null&&S.outfits[S.ed]?S.outfits[S.ed].name:'');if(n===null)return;const o={name:n||'Outfit',items:JSON.parse(JSON.stringify(S.cv))};
  if(S.ed!=null&&S.outfits[S.ed])S.outfits[S.ed]=o;else{S.outfits.push(o);S.ed=S.outfits.length-1}save();alert('Saved')}}
function saved(){$('#v').innerHTML='<div class="row"><div class="list"></div><div class="col"><button id="bu">Backup</button></div></div>';
 if(!S.outfits.length)$('.list').textContent='No outfits yet';
 S.outfits.forEach((o,i)=>{const d=document.createElement('div');d.className='oc';d.innerHTML='<div><div class="pv cvx"></div><b></b></div><div class="col"><button class="op">Open</button><button class="dl">Delete</button></div>';
  d.querySelector('b').textContent=o.name;renderCv(d.querySelector('.pv'),o.items,-1,false);
  d.querySelector('.op').onclick=()=>{S.cv=JSON.parse(JSON.stringify(o.items));S.ed=i;sel=-1;save();go('make')};
  d.querySelector('.dl').onclick=()=>{if(!confirm('Delete this outfit?'))return;S.outfits.splice(i,1);if(S.ed==i)S.ed=null;else if(S.ed>i)S.ed--;save();saved()};$('.list').appendChild(d)});
 $('#bu').onclick=backup}
function backup(){const o=$('#dt');o.style.display='block';o.innerHTML='<h3>Backup / Restore</h3><p>Copy this text and keep it in a note. To restore, paste a backup below and press Restore.</p><textarea id="ta"></textarea><p><button id="cp">Copy</button> <button id="rs">Restore</button> <button id="x">Close</button></p>';
 const t=$('#ta');t.value=JSON.stringify({v:1,tags:S.tags,tray:S.tray,cv:S.cv,outfits:S.outfits,ed:S.ed});
 $('#cp').onclick=()=>{t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy'))};
 $('#rs').onclick=()=>{try{const d=JSON.parse(t.value);if(!d.tags||!d.outfits)throw 0;if(!confirm('Overwrite current data?'))return;
  S.tags=mt(d.tags);S.tray=d.tray||[];S.cv=d.cv||[];S.outfits=d.outfits;S.ed=d.ed??null;clean();save();o.style.display='none';go(V)}catch(e){alert('Not a valid backup')}};
 $('#x').onclick=()=>o.style.display='none'}
function go(v){V=v;sel=-1;$('#dt').style.display='none';$('#dr').style.display='none';$('#bk').style.display=v=='closet'?'block':'none';$('#hg').style.display=v=='make'?'block':'none';
 document.querySelectorAll('nav button').forEach(b=>b.className=b.dataset.v==v?'on':'');({closet:home,make,saved})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#bk').onclick=()=>{S.tray.forEach(i=>{if(!S.cv.some(o=>o.id==i))place(i)});save();go('make')};
$('#hg').onclick=()=>{const d=$('#dr');d.style.display=d.style.display=='block'?'none':'block';drawer()};
fetch('clothes.json').then(r=>r.json()).then(l=>{L=l;load();go('closet')}).catch(()=>$('#v').textContent='Could not load clothes.json');
</script></body></html>
